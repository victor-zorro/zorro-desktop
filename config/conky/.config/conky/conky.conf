conky.config = {
  -- own panel window, so the moving backdrop (apps/zorro-backdrop) can't paint over it;
  -- solid black like the backdrop, so the snow seems to drift behind it
  own_window = true,
  own_window_type = 'desktop',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = false,
  own_window_argb_visual = false,
  own_window_colour = '000000',
  double_buffer = true,
  alignment = 'bottom_right',
  gap_x = 28, gap_y = 28,
  update_interval = 5,
  use_xft = true,
  font = 'DejaVu Sans Mono:size=10',
  default_color = 'c8c8d0',
  color1 = '7f849c',
  draw_shades = false,
  minimum_width = 240,
};
conky.text = [[
${color1}${time %A %d %B}$color
${font DejaVu Sans Mono:size=24}${time %H:%M}$font
${if_existing /sys/class/power_supply/BAT0}
${color1}Battery$color  ${battery_percent BAT0}%  ${battery_status BAT0}
${battery_bar 5,240 BAT0}
${execi 600 ~/.local/bin/zbattery-health}${endif}

${execi 10 ~/.local/bin/zconky-net}
]];
