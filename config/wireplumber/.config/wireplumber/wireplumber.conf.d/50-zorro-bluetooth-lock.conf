# Keep Bluetooth audio (headphones, speakers) running while the screen is locked.
# zorro-dm shows the lock screen on its own VT, which makes this login "inactive" for
# logind; WirePlumber then stops Bluetooth audio, a guard for computers shared by several
# users at once. One user here: keep it on. Standby / hibernate still stop it, as they stop
# everything.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
