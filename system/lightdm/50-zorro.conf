# LightDM GTK greeter: dark, minimal, matches the Openbox desktop.
# Installed to /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d/ (overrides Debian's 01_debian.conf)
[greeter]
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=DejaVu Sans 11
background=#1a1b20
user-background=false
hide-user-image=true
position=50%,center 45%,center
panel-position=top
indicators=~host;~spacer;~clock;~spacer;~session;~power
clock-format=%A %d %B   %H:%M
xft-dpi=96
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
