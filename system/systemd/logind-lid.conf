# Lid closed: suspend, then hibernate after HibernateDelaySec (sleep-zorro.conf).
# Power button (short press): hibernate straight away.
# Installed to /etc/systemd/logind.conf.d/ (laptop profile)
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
HandleLidSwitchDocked=ignore
HandlePowerKey=hibernate
