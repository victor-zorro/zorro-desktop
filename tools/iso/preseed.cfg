# Answers for the Debian installer, so it sets up the Zorro desktop by itself.
# The installer still asks: language, keyboard, network (Wi-Fi), your name and password,
# and which disk to use (that disk is erased: this is never answered for you).

# no root password: your own account gets sudo
d-i passwd/root-login boolean false
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# packages come from the internet, not from the stick
d-i apt-setup/cdrom/set-first boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# a minimal system; the desktop comes from the repo at the first login
tasksel tasksel/first multiselect standard
d-i pkgsel/include string git curl sudo ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i finish-install/reboot_in_progress note

# at the first login on the new system: fetch and install the desktop
d-i preseed/late_command string cp /zorro-first-login.sh /target/etc/profile.d/zorro-first-login.sh; chmod 644 /target/etc/profile.d/zorro-first-login.sh
