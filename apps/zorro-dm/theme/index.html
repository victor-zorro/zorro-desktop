<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>zorro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fx"></canvas>

  <div id="clock" class="hud hidden">
    <div id="time" class="glitch" data-text="00:00">00:00</div>
    <div id="date">—</div>
  </div>

  <main id="login" class="hidden">
    <div id="host" class="label">signal</div>
    <div id="user" class="glitch" data-text=""></div>
    <form id="form" autocomplete="off">
      <input id="entry" type="password" spellcheck="false" autocomplete="off">
      <span class="caret">_</span>
    </form>
    <div id="msg"></div>
    <button id="face" type="button" hidden title="unlock with your face">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/>
      </svg>
    </button>
  </main>

  <nav id="power" class="hud hidden">
    <button data-act="suspend">suspend</button>
    <button data-act="restart">reboot</button>
    <button data-act="shutdown">power off</button>
  </nav>

  <script src="js/animals.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
